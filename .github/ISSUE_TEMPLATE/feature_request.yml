name: 功能建议
description: 希望扩展支持某个能力
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明**使用场景**，而不是只写“加一个功能”。个人项目会优先做能复用现有链路、可测试的改动。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的具体问题
      placeholder: "每次都要 ...，希望能 ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的交互 / 结果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你目前怎么绕过
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      multiple: true
      options:
        - 字幕抓取 / 身份校验
        - 多语言 / 翻译
        - 语音转录
        - AI 总结 / 对话
        - 联网检索
        - 内嵌面板 / 侧边栏
        - 导出 / 批量 / 历史
        - 设置 / 诊断
        - 其他
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 这不是“自动上传 / 自动发布”一类需要账号授权的需求
          required: false
