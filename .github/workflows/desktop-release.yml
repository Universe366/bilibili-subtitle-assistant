name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 0.2.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
      - run: npm run typecheck

      - run: npm run build

      - run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Prepare green package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $dir = 'release/win-unpacked'
          @"
          B站字幕助手 $version 绿色版

          1. 进入本目录，双击 B站字幕助手.exe。
          2. 数据保存在 %APPDATA%\bsub-desktop。
          "@ | Set-Content -Path "$dir/README.txt" -Encoding UTF8
          Compress-Archive -Path "$dir/*" -DestinationPath "release/bsub-desktop-$version-win-x64-green.zip" -Force

      - run: npm run release:notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', inputs.version) }}
          name: 桌面端 ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', inputs.version) }}
          body_path: desktop/release/release-notes.md
          files: |
            desktop/release/*.exe
            desktop/release/*.yml
            desktop/release/*.blockmap
            desktop/release/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
