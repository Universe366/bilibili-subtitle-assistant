name: Desktop + Extension Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '插件版本号（例如 2.17.1）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Prepare green package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $dir = 'release/win-unpacked'
          @"
          B站字幕助手 $version 绿色版

          1. 进入本目录，双击 B站字幕助手.exe。
          2. 数据保存在 %APPDATA%\bsub-desktop。
          "@ | Set-Content -Path "$dir/README.txt" -Encoding UTF8
          Compress-Archive -Path "$dir/*" -DestinationPath "release/bsub-desktop-$version-win-x64-green.zip" -Force

      - name: Package browser extension
        shell: pwsh
        run: |
          $extVersion = (Get-Content ../bilibili-subtitle-assistant/manifest.json -Raw | ConvertFrom-Json).version
          Compress-Archive -Path ../bilibili-subtitle-assistant -DestinationPath "release/bilibili-subtitle-assistant-v$extVersion.zip" -Force
          Write-Output "extension=$extVersion"

      - run: npm run release:notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          name: 桌面端 + 插件 ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          body_path: desktop/release/release-notes.md
          files: |
            desktop/release/bsub-desktop-setup-*.exe
            desktop/release/bsub-desktop-*.zip
            desktop/release/bilibili-subtitle-assistant-*.zip
            desktop/release/latest.yml
            desktop/release/*.blockmap
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
