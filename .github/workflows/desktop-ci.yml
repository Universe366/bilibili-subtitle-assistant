name: Desktop checks

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'shizi-extension/**'
      - '.github/workflows/desktop-ci.yml'
  push:
    branches:
      - master
    paths:
      - 'desktop/**'
      - 'shizi-extension/**'
      - '.github/workflows/desktop-ci.yml'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
